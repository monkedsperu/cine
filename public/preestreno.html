<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consultar preestreno</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono&display=swap" rel="stylesheet">
<style>
:root {
  --bg:     #f3f4f9;
  --card:   #ffffff;
  --border: #e6e9f0;
  --text:   #1f1f2e;
  --muted:  #8d90a5;
  --purple: #8f5fe8;
  --purple-2: #7a48de;
  --cyan:   #1ccfd9;
  --pink:   #fe5c7c;
  --green:  #2fcc71;
  --orange: #f96b1a;
  --orange-2: #fbb03b;
  --radius: 6px;
  --shadow: 0 1px 3px rgba(20,20,40,.06);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Roboto', -apple-system, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); font-size: 14px; }
button, input { font-family: inherit; }

.topbar {
  height: 60px; background: var(--card); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 16px; padding: 0 24px; position: sticky; top: 0; z-index: 30;
}
.topbar h1 { font-size: 1rem; font-weight: 500; }
.top-right { margin-left: auto; display: flex; align-items: center; gap: 12px; font-size: .8rem; color: var(--muted); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  padding: 9px 14px; border-radius: var(--radius); border: 1px solid transparent; cursor: pointer;
  font-size: .82rem; font-weight: 500; white-space: nowrap; text-decoration: none;
}
.btn-sm { padding: 6px 10px; font-size: .78rem; }
.btn-light { background: #fff; color: var(--text); border-color: var(--border); }
.btn-light:hover { border-color: var(--purple); color: var(--purple); }
.btn-purple { background: var(--purple); color: #fff; }
.btn-purple:hover { background: var(--purple-2); }
.btn:disabled { opacity: .6; cursor: default; }

.wrap { display: grid; grid-template-columns: 380px 1fr; gap: 20px; padding: 20px 24px; max-width: 1400px; margin: 0 auto; }
.card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); }
.card-head { display: flex; align-items: center; gap: 10px; padding: 16px 20px; border-bottom: 1px solid var(--border); }
.card-title { font-size: .95rem; font-weight: 500; }
.card-sub { font-size: .78rem; color: var(--muted); margin-left: auto; }

/* ── Lista ── */
.search { padding: 14px 16px 10px; display: flex; flex-direction: column; gap: 10px; }
.search input {
  width: 100%; height: 38px; border: 1px solid var(--border); border-radius: 4px; padding: 0 12px;
  font-size: .85rem; color: var(--text); background: #fff; outline: none;
}
.search input:focus { border-color: var(--purple); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--border); background: #fff; color: var(--muted); border-radius: 14px; padding: 4px 11px; font-size: .75rem; cursor: pointer; }
.chip.on { background: var(--purple); border-color: var(--purple); color: #fff; }
.list { max-height: calc(100vh - 230px); overflow-y: auto; border-top: 1px solid var(--border); }
.item { display: flex; gap: 12px; align-items: center; padding: 10px 16px; cursor: pointer; border-bottom: 1px solid #f1f2f6; }
.item:hover { background: #f8f7fd; }
.item.sel { background: rgba(143,95,232,.08); box-shadow: inset 3px 0 var(--purple); }
.poster { width: 38px; height: 56px; border-radius: 3px; background: #e9ebf2; object-fit: cover; flex-shrink: 0; }
.item .t { font-size: .85rem; font-weight: 500; line-height: 1.25; }
.item .s { font-size: .72rem; color: var(--muted); margin-top: 4px; display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
.count { margin-left: auto; font-size: .72rem; font-weight: 500; white-space: nowrap; color: var(--muted); }
.count.has { color: var(--green); }
.list-empty { padding: 30px 16px; text-align: center; color: var(--muted); font-size: .85rem; }

.badge + .badge { margin-left: 4px; }
.badge { display: inline-block; font-size: .66rem; font-weight: 500; padding: 1px 6px; border-radius: 3px; text-transform: uppercase; letter-spacing: .3px; }
.b-pre  { background: rgba(28,207,217,.14); color: #0f9aa2; }
.b-soon { background: rgba(251,176,59,.18); color: #c07a07; }
.b-new  { background: rgba(47,204,113,.14); color: #1f9e55; }
.b-res  { background: rgba(254,92,124,.12); color: #d63d5c; }

/* ── Detalle ── */
.detail-body { padding: 20px; }
.movie-head { display: flex; gap: 18px; }
.movie-head .poster { width: 96px; height: 142px; }
.movie-head h2 { font-size: 1.15rem; font-weight: 500; margin-bottom: 6px; }
.meta { font-size: .8rem; color: var(--muted); line-height: 1.7; }
.meta b { color: var(--text); font-weight: 500; }
.meta code { font-family: 'Roboto Mono', monospace; font-size: .76rem; background: #f3f4f9; padding: 1px 5px; border-radius: 3px; color: var(--text); }

.verdict { margin: 18px 0; border-radius: var(--radius); padding: 14px 16px; font-size: .9rem; line-height: 1.45; }
.verdict b { font-weight: 700; }
.v-yes { background: rgba(47,204,113,.12); color: #177a42; }
.v-no  { background: rgba(251,176,59,.14); color: #9a6205; }
.v-err { background: rgba(254,92,124,.12); color: #c02c4b; }

.watch { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: .8rem; color: var(--muted); padding: 12px 20px; border-top: 1px solid var(--border); }
.watch label { display: flex; align-items: center; gap: 6px; cursor: pointer; color: var(--text); }
.watch input { accent-color: var(--purple); }

.cinema { border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 12px; }
.cinema-name { padding: 10px 14px; font-weight: 500; font-size: .88rem; border-bottom: 1px solid var(--border); background: #fafbfd; display: flex; }
.cinema-name span { margin-left: auto; font-size: .75rem; color: var(--muted); font-weight: 400; }
.day { display: flex; gap: 12px; padding: 10px 14px; border-bottom: 1px solid #f1f2f6; align-items: baseline; }
.day:last-child { border-bottom: none; }
.day-lbl { width: 110px; flex-shrink: 0; font-size: .78rem; color: var(--muted); text-transform: capitalize; }
.times { display: flex; gap: 6px; flex-wrap: wrap; }
.time { border: 1px solid var(--border); border-radius: 4px; padding: 4px 8px; font-size: .78rem; line-height: 1.3; }
.time b { font-weight: 500; }
.time small { display: block; color: var(--muted); font-size: .68rem; }

.empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 300px; color: var(--muted); gap: 10px; font-size: .9rem; text-align: center; padding: 20px; }
.empty-state .ico { font-size: 2rem; }
.spinner { width: 18px; height: 18px; border: 2px solid var(--border); border-top-color: var(--purple); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.col { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.full { grid-column: 1 / -1; }
.btn-green { background: var(--green); color: #fff; }
.btn-pink  { background: var(--pink); color: #fff; }
.btn-pause { background: #fff; color: var(--orange); border-color: var(--orange); }

/* ── Formulario del vigía ── */
.wform { padding: 16px 20px 20px; display: flex; flex-direction: column; gap: 14px; }
.wform .note { font-size: .78rem; color: var(--muted); line-height: 1.5; }
.wform details.adv { border: 1px solid var(--border); border-radius: 6px; padding: 10px 14px; }
.wform details.adv > summary { cursor: pointer; font-weight: 500; font-size: .85rem; user-select: none; }
.wform details.adv[open] > summary { margin-bottom: 10px; }
.wform .opts { display: flex; flex-direction: column; gap: 6px; font-size: .82rem; }
.wform .opts label { display: flex; gap: 8px; align-items: center; cursor: pointer; }
.wform .opts input[type=checkbox] { accent-color: var(--purple); width: 15px; height: 15px; }
.wform .presets { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.wform .prof-row .btn.on { border-color: var(--purple); color: var(--purple); box-shadow: 0 0 0 2px rgba(143,95,232,.3); font-weight: 700; }
.prof { display: inline-flex; align-items: center; gap: 4px; font-size: .7rem; font-weight: 700; padding: 2px 8px; border-radius: 99px; white-space: nowrap; vertical-align: middle; }
.prof-preventa { background: linear-gradient(135deg, #f96b1a, #e8114b); color: #fff; }
.prof-normal { background: #e6e9f0; color: #4b4f63; }
.prof-custom { background: #efe9fd; color: var(--purple); }
.prof small { font-weight: 500; opacity: .85; }
.info-tip { position: relative; display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; border-radius: 50%;
  background: #eef0f5; color: var(--muted); border: 1px solid var(--border); font-size: .72rem; font-weight: 700; cursor: help; font-style: normal; }
.info-tip .tip { display: none; position: absolute; z-index: 60; top: 24px; left: -10px; width: 340px; background: #1f1f2e; color: #e8e8f0; border-radius: 6px;
  padding: 10px 12px; font-size: .76rem; font-weight: 400; line-height: 1.45; text-align: left; box-shadow: 0 8px 24px rgba(0,0,0,.3); }
.info-tip:hover .tip, .info-tip:focus .tip { display: block; }
.info-tip .tip b { color: #fff; } .info-tip .tip ul { margin: 4px 0 8px 16px; padding: 0; }
.wform .prof-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: .85rem; }
.wform .edit-banner { background: #f4effe; border: 1px solid #d9cdf7; border-radius: 6px; padding: 8px 12px; font-size: .82rem; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.frow { display: flex; gap: 14px; flex-wrap: wrap; }
.field { display: flex; flex-direction: column; gap: 5px; }
.field > label { font-size: .7rem; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
.field input[type=number], .field input[type=text] { height: 36px; border: 1px solid var(--border); border-radius: 4px; padding: 0 10px; font-size: .85rem; width: 100px; }
.field input:focus { outline: none; border-color: var(--purple); }
.range { display: flex; align-items: center; gap: 6px; font-size: .8rem; color: var(--muted); }
.range input { width: 70px !important; }
.cine-box { border: 1px solid var(--border); border-radius: var(--radius); }
.cine-box input.filter { width: 100%; height: 34px; border: none; border-bottom: 1px solid var(--border); padding: 0 12px; font-size: .82rem; outline: none; border-radius: var(--radius) var(--radius) 0 0; }
.cine-list { max-height: 220px; overflow-y: auto; padding: 6px 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); }
.cine-list label { display: flex; align-items: center; gap: 8px; padding: 5px 12px; font-size: .82rem; cursor: pointer; }
.cine-list label:hover { background: #f8f7fd; }
.cine-list input { accent-color: var(--purple); }
.has-fn { font-size: .66rem; color: #1f9e55; background: rgba(47,204,113,.14); padding: 1px 5px; border-radius: 3px; }
.sel-count { font-size: .78rem; color: var(--muted); }
.form-err { font-size: .8rem; color: #c02c4b; }

/* ── Vigías ── */
.watchers { padding: 6px 20px 20px; display: flex; flex-direction: column; gap: 14px; }
.watchers-empty { padding: 4px 20px 18px; color: var(--muted); font-size: .85rem; }
.wcard { border: 1px solid var(--border); border-radius: var(--radius); }
.wcard.found { border-color: var(--green); box-shadow: 0 0 0 3px rgba(47,204,113,.12); }
.whead { display: flex; gap: 14px; padding: 12px 14px; align-items: flex-start; flex-wrap: wrap; }
.whead .poster { width: 44px; height: 64px; }
.wmain { flex: 1; min-width: 220px; }
.wtitle { font-weight: 500; font-size: .92rem; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.wline { font-size: .76rem; color: var(--muted); margin-top: 4px; line-height: 1.5; }
.wline b { color: var(--text); font-weight: 500; }
.wactions { display: flex; gap: 6px; flex-wrap: wrap; }
.st { display: inline-block; font-size: .68rem; font-weight: 500; padding: 2px 7px; border-radius: 3px; color: #fff; white-space: nowrap; }
.st-run { background: var(--purple); } .st-stop { background: #c4c7d6; } .st-found { background: var(--green); }
.st-hold { background: var(--cyan); } .st-try { background: var(--orange-2); } .st-pause { background: #fff; color: var(--orange); box-shadow: inset 0 0 0 1px var(--orange); }
.st-alert { background: #e8114b; animation: pulse 1.2s ease-in-out infinite; } .st-err { background: var(--pink); }
.wsess { width: 100%; border-collapse: collapse; font-size: .78rem; }
.wsess td { padding: 7px 14px; border-top: 1px solid #f1f2f6; vertical-align: top; }
.wsess td:first-child { white-space: nowrap; }
.wsess .muted { color: var(--muted); }
.wevents { border-top: 1px solid var(--border); padding: 8px 14px; font-size: .74rem; color: var(--muted); line-height: 1.6; font-family: 'Roboto Mono', monospace; max-height: 110px; overflow-y: auto; }
.wevents .success { color: #1f9e55; } .wevents .warn { color: #b87100; } .wevents .error { color: #c02c4b; }

/* ── Aviso de butacas libres ── */
.alerts { position: sticky; top: 60px; z-index: 25; padding: 0 24px; max-width: 1400px; margin: 0 auto; }
.alert-box {
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding: 16px 20px; border-radius: var(--radius); margin-top: 14px;
  background: linear-gradient(100deg, #e8114b, #f96b1a); color: #fff; box-shadow: 0 6px 24px rgba(232,17,75,.35);
  animation: alertGlow 1.6s ease-in-out infinite;
}
.alert-ico { font-size: 2rem; line-height: 1; animation: ring 1s ease-in-out infinite; }
.alert-main { flex: 1; min-width: 200px; }
.alert-title { font-size: 1.1rem; font-weight: 700; }
.alert-sub { font-size: .84rem; opacity: .95; margin-top: 3px; }
.alert-seats { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 8px; }
.alert-seats span { background: #fff; color: #c20d3e; font-weight: 700; font-size: .85rem; padding: 3px 9px; border-radius: 4px; }
.alert-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.alert-actions .btn { background: rgba(255,255,255,.18); color: #fff; border-color: rgba(255,255,255,.6); }
.alert-actions .btn.solid { background: #fff; color: #c20d3e; border-color: #fff; }
@keyframes pulse { 50% { opacity: .55; } }
@keyframes alertGlow { 50% { box-shadow: 0 6px 34px rgba(232,17,75,.6); } }
@keyframes ring { 0%, 100% { transform: rotate(0); } 20% { transform: rotate(-15deg); } 40% { transform: rotate(13deg); } 60% { transform: rotate(-8deg); } }

@media (max-width: 860px) {
  .alerts { padding: 0 16px; }
  .wsess td { padding: 7px 10px; }
  .wrap { grid-template-columns: 1fr; padding: 16px; }
  .list { max-height: 45vh; }
  .topbar { padding: 0 16px; }
  .top-right .hide-sm { display: none; }
  .day { flex-direction: column; gap: 6px; }
}
/* Editor del bloque de butacas */
.blk { display: flex; gap: 18px; flex-wrap: wrap; align-items: flex-start; margin: 4px 0 14px; }
.blk-grid { background: #f7f8fc; border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px 12px; user-select: none; }
.blk-screen { height: 5px; margin: 0 auto 4px; width: 70%; background: #c9cedb; border-radius: 0 0 50% 50%; }
.blk-sl { text-align: center; font-size: .65rem; color: var(--muted); letter-spacing: 1px; margin-bottom: 8px; }
.blk-rows { display: flex; flex-direction: column; gap: 3px; }
.blk-row { display: flex; gap: 3px; }
.blk-l { width: 12px; font-size: .6rem; color: var(--muted); text-align: center; line-height: 11px; }
.blk-c { width: 13px; height: 11px; border-radius: 3px 3px 2px 2px; background: #fff; border: 1px solid #d3d7e2; cursor: pointer; }
.blk-c:hover { border-color: var(--purple); }
.blk-c.on { background: var(--purple); border-color: var(--purple); }
.blk-c.mid { box-shadow: inset 0 0 0 2px #fff; }
.blk-side { display: flex; flex-direction: column; gap: 10px; min-width: 220px; }
.blk-side .frow { gap: 10px; }
.blk-side .field input[type=number] { width: 80px; }
.blk-sum { font-size: .8rem; color: var(--text); line-height: 1.5; }
.blk-sum b { color: var(--purple); }
</style>
</head>
<body>

<header class="topbar">
  <a class="btn btn-light btn-sm" href="/">← Volver al panel</a>
  <h1>Consultar preestreno</h1>
  <div class="top-right"><span class="hide-sm" id="lastCheck"></span></div>
</header>

<div class="alerts" id="alerts"></div>

<main class="wrap">
  <!-- ═══ Vigías ═══ -->
  <section class="card full" id="watchersCard">
    <div class="card-head">
      <div class="card-title">🔭 Vigías de preestreno</div>
      <div class="card-sub" id="watchersSub"></div>
      <button class="btn btn-light btn-sm" onclick="simulateAlert()" title="Muestra cómo se ve y suena el aviso de butacas libres, sin tocar ningún job">🔔 Simular aviso</button>
    </div>
    <div id="watchers"><div class="watchers-empty">Cargando…</div></div>
  </section>

  <!-- ═══ Lista de películas ═══ -->
  <section class="card">
    <div class="card-head">
      <div class="card-title">Películas</div>
      <button class="btn btn-light btn-sm" style="margin-left:auto" onclick="loadList()">↻ Actualizar</button>
    </div>
    <div class="search">
      <input id="q" placeholder="Buscar por título o ID (HO0000…)" autocomplete="off" oninput="renderList()" onkeydown="if (event.key === 'Enter') searchEnter()">
      <div class="chips" id="chips">
        <button class="chip on" data-f="upcoming">Preventa y próximos</button>
        <button class="chip" data-f="nosessions">Sin funciones</button>
        <button class="chip" data-f="all">Todas</button>
      </div>
    </div>
    <div class="list" id="list"><div class="empty-state" style="min-height:160px"><div class="spinner"></div>Cargando cartelera…</div></div>
  </section>

  <div class="col">
  <!-- ═══ Detalle ═══ -->
  <section class="card" id="detailCard">
    <div class="card-head">
      <div class="card-title">Funciones</div>
      <div class="card-sub" id="detailSub"></div>
    </div>
    <div id="detail">
      <div class="empty-state"><div class="ico">🎟</div>Elige una película de la lista o escribe su ID<br>para ver si ya tiene funciones a la venta.</div>
    </div>
  </section>

  <!-- ═══ Nuevo vigía ═══ -->
  <section class="card" id="watchFormCard" style="display:none">
    <div class="card-head">
      <div class="card-title" id="wfTitle">Vigilar y reservar automáticamente</div>
      <div class="card-sub" id="wfSub"></div>
    </div>
    <div class="wform" id="watchForm"></div>
  </section>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const TZ = 'America/Lima';
const fmtTime  = iso => new Date(iso).toLocaleTimeString('es-PE', { hour: '2-digit', minute: '2-digit' });
const fmtClock = iso => new Date(iso).toLocaleTimeString('es-PE', { hour: '2-digit', minute: '2-digit', second: '2-digit', timeZone: TZ });
// Las fechas del cine vienen sin zona ("2026-09-29T00:00:00"): se muestran tal cual, sin convertir
const fmtDate  = ymd => new Date(ymd + 'T12:00:00Z').toLocaleDateString('es-PE', { weekday: 'short', day: '2-digit', month: 'short', timeZone: 'UTC' });

const WATCH_MS = 60000;
const state = { movies: [], filter: 'upcoming', movieId: null, data: null, timer: null, loading: false };

async function api(path, opts = {}) {
  const r = await fetch(path, { credentials: 'same-origin', ...opts });
  if (r.status === 401) { location.href = '/login'; throw new Error('No autenticado'); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || `HTTP ${r.status}`);
  return j;
}

// ── Lista ─────────────────────────────────────────────────────────────────────
async function loadList() {
  try {
    const d = await api('/bot/presale');
    state.movies = d.movies || [];
    renderList();
  } catch (e) {
    $('list').innerHTML = `<div class="list-empty">❌ ${esc(e.message)}</div>`;
  }
}

function badges(m) {
  return [
    m.isPreSale    && '<span class="badge b-pre">Preventa</span>',
    m.isComingSoon && '<span class="badge b-soon">Próximo</span>',
    m.isNewRelease && '<span class="badge b-new">Estreno</span>',
    (m.restricted || m.bookingRestricted) && '<span class="badge b-res" title="El cine la marca como restringida">Restringida</span>',
  ].filter(Boolean).join('');
}

function renderList() {
  const q = $('q').value.trim().toLowerCase();
  let list = state.movies;
  if (state.filter === 'upcoming')   list = list.filter(m => m.isPreSale || m.isComingSoon);
  if (state.filter === 'nosessions') list = list.filter(m => m.sessionCount === 0);
  if (q) list = state.movies.filter(m => m.title.toLowerCase().includes(q) || m.id.toLowerCase().includes(q));  // la búsqueda ignora el filtro
  list = [...list].sort((a, b) => String(a.openingDate).localeCompare(String(b.openingDate)) || a.title.localeCompare(b.title));

  if (!list.length) {
    const looksId = /^[a-z0-9]{6,20}$/i.test(q) && /\d/.test(q);
    $('list').innerHTML = `<div class="list-empty">Sin resultados.${looksId ? `<br><br><button class="btn btn-purple btn-sm" onclick="selectMovie('${esc(q.toUpperCase())}')">Consultar ID ${esc(q.toUpperCase())}</button>` : ''}</div>`;
    return;
  }
  $('list').innerHTML = list.map(m => `
    <div class="item${m.id === state.movieId ? ' sel' : ''}" onclick="selectMovie('${esc(m.id)}')">
      ${m.posterUrl ? `<img class="poster" loading="lazy" src="${esc(m.posterUrl)}" alt="" onerror="this.style.visibility='hidden'">` : '<div class="poster"></div>'}
      <div style="min-width:0">
        <div class="t">${esc(m.title)}</div>
        <div class="s">${m.openingDate ? `Estreno ${fmtDate(String(m.openingDate).slice(0, 10))}` : ''} ${badges(m)}</div>
      </div>
      <div class="count${m.sessionCount ? ' has' : ''}">${m.sessionCount ? `${m.sessionCount} func.` : 'sin func.'}</div>
    </div>`).join('');
}

function searchEnter() {
  const q = $('q').value.trim();
  const hit = state.movies.filter(m => m.title.toLowerCase().includes(q.toLowerCase()) || m.id.toLowerCase() === q.toLowerCase());
  if (hit.length === 1) selectMovie(hit[0].id);
  else if (!hit.length && /^[a-z0-9]{6,20}$/i.test(q)) selectMovie(q.toUpperCase());
}

$('chips').addEventListener('click', e => {
  const f = e.target.closest('.chip')?.dataset.f;
  if (!f) return;
  state.filter = f;
  document.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c.dataset.f === f));
  renderList();
});

// ── Detalle ───────────────────────────────────────────────────────────────────
function selectMovie(id) {
  state.movieId = id;
  state.data = null;
  history.replaceState(null, '', `?id=${encodeURIComponent(id)}`);
  renderList();
  $('detail').innerHTML = '<div class="empty-state"><div class="spinner"></div>Consultando funciones…</div>';
  renderWatchForm();
  check();
}

async function check() {
  if (!state.movieId || state.loading) return;
  const id = state.movieId;
  state.loading = true;
  const prevCount = state.data?.found ? countSessions(state.data) : null;
  try {
    const d = await api(`/bot/presale?movieId=${encodeURIComponent(id)}`);
    if (id !== state.movieId) return;       // se cambió de película mientras tanto
    state.data = d;
    const now = countSessions(d);
    if (prevCount === 0 && now > 0) announce(d.movie.title, now);
    markCinemasWithSessions();
    const inList = d.found && state.movies.find(m => m.id === d.movie.id);
    if (inList && inList.sessionCount !== d.movie.sessionCount) { Object.assign(inList, d.movie); renderList(); }
    renderDetail();
  } catch (e) {
    if (id !== state.movieId) return;
    state.data = { error: e.message };
    renderDetail();
  } finally {
    state.loading = false;
    $('lastCheck').textContent = `Última consulta: ${fmtClock(new Date())}`;
  }
}

const countSessions = d => (d.cinemas || []).reduce((n, c) => n + c.sessions.length, 0);

function renderDetail() {
  const d = state.data;
  const watching = !!state.timer;
  const watchBar = `
    <div class="watch">
      <label><input type="checkbox" id="watchChk" ${watching ? 'checked' : ''} onchange="toggleWatch(this.checked)"> Revisar cada minuto mientras esta página esté abierta</label>
      <button class="btn btn-light btn-sm" style="margin-left:auto" onclick="check()">↻ Consultar ahora</button>
    </div>`;

  if (d.error) {
    $('detailSub').textContent = '';
    $('detail').innerHTML = `<div class="detail-body"><div class="verdict v-err">❌ No se pudo consultar: ${esc(d.error)}</div></div>${watchBar}`;
    return;
  }
  if (!d.found) {
    $('detailSub').textContent = d.movieId;
    $('detail').innerHTML = `<div class="detail-body"><div class="verdict v-no">
      ⏳ <b>${esc(d.movieId)}</b> no aparece en la cartelera del cine todavía.<br>
      Puede que el ID esté mal o que la película aún no se haya publicado. Si activas la revisión, aparecerá aquí en cuanto la publiquen.
    </div></div>${watchBar}`;
    return;
  }

  const m = d.movie, total = countSessions(d);
  const withSessions = d.cinemas.filter(c => c.sessions.length);
  $('detailSub').textContent = m.id;
  document.title = total ? `✅ ${m.title} · ${total} ${total !== 1 ? 'funciones' : 'función'}` : `${m.title} · sin funciones`;

  const verdict = total
    ? `<div class="verdict v-yes">✅ <b>Ya hay ${total} ${total !== 1 ? 'funciones' : 'función'}</b> en ${withSessions.length} cine${withSessions.length !== 1 ? 's' : ''}.${(m.restricted || m.bookingRestricted) ? '<br>El cine la marca como restringida: puede que la compra no esté abierta para todos aunque las funciones existan.' : ''}</div>`
    : `<div class="verdict v-no">⏳ <b>Todavía no hay funciones.</b> El cine aún no ha publicado horarios para esta película.</div>`;

  const cinemasHtml = withSessions.map(c => {
    const byDay = {};
    for (const s of c.sessions) (byDay[String(s.date).slice(0, 10)] ||= []).push(s);
    for (const list of Object.values(byDay)) list.sort((a, b) => !a.showtime - !b.showtime);   // sin hora al final
    const days = Object.keys(byDay).sort().map(day => `
      <div class="day">
        <div class="day-lbl">${fmtDate(day)}</div>
        <div class="times">${byDay[day].map(s => {
          const extra = [s.screenName, (s.languages || []).join('/'), s.formats].filter(Boolean).join(' · ');
          return `<div class="time"><b>${s.showtime ? fmtTime(s.showtime) : '—'}</b>${extra ? `<small>${esc(extra)}</small>` : ''}${!s.detail ? `<small title="La función existe pero el cine no publicó su detalle">${esc(s.id)}</small>` : ''}</div>`;
        }).join('')}</div>
      </div>`).join('');
    return `<div class="cinema"><div class="cinema-name">${esc(c.name)}<span>${c.sessions.length} ${c.sessions.length !== 1 ? 'funciones' : 'función'}</span></div>${days}</div>`;
  }).join('');

  $('detail').innerHTML = `
    <div class="detail-body">
      <div class="movie-head">
        ${m.posterUrl ? `<img class="poster" src="${esc(m.posterUrl)}" alt="" onerror="this.style.visibility='hidden'">` : ''}
        <div>
          <h2>${esc(m.title)}</h2>
          <div class="meta">
            ${badges(m)}<br>
            ${m.openingDate ? `Estreno: <b>${fmtDate(String(m.openingDate).slice(0, 10))}</b><br>` : ''}
            ${[m.genre, m.rating, m.runtime ? `${m.runtime} min` : ''].filter(Boolean).map(esc).join(' · ')}<br>
            ID: <code>${esc(m.id)}</code>
          </div>
        </div>
      </div>
      ${verdict}
      ${cinemasHtml}
    </div>${watchBar}`;
}

// ── Revisión periódica ────────────────────────────────────────────────────────
function toggleWatch(on) {
  clearInterval(state.timer);
  state.timer = on ? setInterval(check, WATCH_MS) : null;
  if (on && 'Notification' in window && Notification.permission === 'default') Notification.requestPermission().catch(() => {});
}

function announce(title, n, custom) {
  const msg = custom ? `${title} · ${custom}` : `${title}: ya hay ${n} ${n !== 1 ? 'funciones' : 'función'}`;
  try { if (Notification.permission === 'granted') new Notification(custom ? '🔔 Asientos libres' : '🎬 Funciones disponibles', { body: msg }); } catch {}
  try {
    const ctx = new AudioContext(), o = ctx.createOscillator(), g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination); o.frequency.value = 880; g.gain.value = .08;
    o.start(); o.stop(ctx.currentTime + .4);
  } catch {}
}

// Perfiles (vienen del servidor): campo del formulario ↔ valor del perfil (ms → s)
const WF_FIELDS = {
  intervalMs: ['wfInterval', 1000], baselineMs: ['wfBaseline', 1000], windowMinMs: ['wfWinMin', 1000], windowMaxMs: ['wfWinMax', 1000],
  retryMinMs: ['wfRetryMin', 1000], retryMaxMs: ['wfRetryMax', 1000], threads: ['wfThreads', 1], fireMode: ['wfFire', 0],
  burst: ['wfBurst', 0], burstLeadMs: ['wfBurstLead', 1000], burstIntervalMs: ['wfBurstEvery', 1000], burstSpanMs: ['wfBurstSpan', 1000],
};
const PROFILE_NAMES = { preventa: '⚡ Preventa', normal: 'Normal', custom: 'Personalizado' };
let profiles = null;

function profileInfoHtml() {
  if (!profiles) return '<div class="tip">Cargando…</div>';
  return `<div class="tip">${Object.values(profiles).map(p => `<b>${esc(p.label)}</b><ul>${p.info.map(x => `<li>${esc(x)}</li>`).join('')}</ul>`).join('')}
    <span style="opacity:.75">Los jobs que crea un vigía usan el perfil del vigía (Preventa por defecto).</span></div>`;
}
function profileBadge(profile, diff = []) {
  const p = profile in PROFILE_NAMES ? profile : 'custom';
  return `<span class="prof prof-${p}" title="${esc(diff.length ? `Ajustado: ${diff.join(', ')}` : (profiles?.[p]?.info || []).join(' '))}">${PROFILE_NAMES[p]}${diff.length ? ' <small>· ajustado</small>' : ''}</span>`;
}
function wfDiff() {
  const p = profiles?.[wf.profile];
  if (!p) return [];
  return Object.entries(WF_FIELDS).filter(([k, [id, mul]]) => {
    const el = $(id);
    const v = el.type === 'checkbox' ? el.checked : mul ? Math.round(parseFloat(el.value) * mul) : el.value;
    return v !== p.values[k];
  }).map(([k]) => k);
}
function renderWfProfile() {
  if (!$('wfProfLine')) return;
  for (const n of ['preventa', 'normal']) $(`wfP-${n}`)?.classList.toggle('on', wf.profile === n);
  const d = wfDiff();
  $('wfProfLine').innerHTML = d.length ? profileBadge(wf.profile, d) : '';
}
function wfPreset(name) {
  const p = profiles?.[name];
  if (!p) return;
  for (const [k, [id, mul]] of Object.entries(WF_FIELDS)) {
    const v = p.values[k];
    typeof v === 'boolean' ? ($(id).checked = v) : ($(id).value = mul ? v / mul : v);
  }
  wf.profile = name;
  renderBlock(); renderWfProfile();
}

function editWatcher(id) {
  const w = wf.list.find(x => x.id === id);

  renderWatchForm(w);

function cancelEdit() {
  wf.editing = null;

// ── Editor del bloque: sala genérica de BLK_W × BLK_H, la fila 0 junto a la pantalla ──
const BLK_W = 23, BLK_H = 14;
const blk = { depth: 60, shift: 0 };   // centro: % de profundidad desde la pantalla; butacas a la derecha del centro
const clampN = (v, lo, hi, d) => { const n = parseInt(v); return Math.min(hi, Math.max(lo, Number.isFinite(n) ? n : d)); };

function renderBlock() {
  if (!$('blkGrid')) return;
  const W = clampN($('wfCols').value, 1, 30, 5), H = clampN($('wfRows').value, 1, 15, 1);
  const w = Math.min(W, BLK_W), h = Math.min(H, BLK_H);
  const mid = (BLK_W - 1) / 2;
  const r0 = Math.min(BLK_H - h, Math.max(0, Math.round(blk.depth / 100 * (BLK_H - 1) - (h - 1) / 2)));
  const c0 = Math.min(BLK_W - w, Math.max(0, Math.round(mid + blk.shift - (w - 1) / 2)));
  let html = '';
  for (let r = 0; r < BLK_H; r++) {
    const letter = String.fromCharCode(65 + r);   // A = fila junto a la pantalla
    html += `<div class="blk-row"><span class="blk-l">${letter}</span>`;
    for (let c = 0; c < BLK_W; c++) {
      const on = r >= r0 && r < r0 + h && c >= c0 && c < c0 + w;
      html += `<div class="blk-c${on ? ' on' : ''}${c === Math.round(mid + blk.shift) && r === Math.round(blk.depth / 100 * (BLK_H - 1)) ? ' mid' : ''}" onclick="moveBlock(${r},${c})"></div>`;
    }
    html += `<span class="blk-l">${letter}</span></div>`;
  }
  $('blkGrid').innerHTML = html;
  const total = W * H, per = clampN($('wfPerOrder').value, 1, 50, 10), th = clampN($('wfThreads').value, 1, 6, 3);
  const orders = Math.ceil(total / per);
  const all = $('wfFire')?.value === 'all';
  const side = blk.shift === 0 ? 'centrado' : `${Math.abs(blk.shift)} butaca${Math.abs(blk.shift) > 1 ? 's' : ''} a la ${blk.shift > 0 ? 'derecha' : 'izquierda'}`;
  const fromL = String.fromCharCode(65 + r0), toL = String.fromCharCode(65 + r0 + h - 1);
  $('blkSum').innerHTML = `<b>${W}×${H} = ${total} butacas</b> por función<br>${side}, filas ${fromL === toL ? fromL : `${fromL}–${toL}`} en esta sala de ${BLK_H} filas (A junto a la pantalla)<br><span class="muted">En cada sala real se ubica a la misma profundidad (${blk.depth}%)</span><br>`
    + `${orders} ${orders > 1 ? 'órdenes' : 'orden'} de hasta ${per} · ${th} hilo${th > 1 ? 's' : ''}`
    + (all ? ` → ${orders * th} disparos al liberarse` : ` → ${orders} disparos al liberarse (+ respaldo si el cine falla)`);
}

function moveBlock(r, c) {
  blk.depth = Math.round(r / (BLK_H - 1) * 100);
  blk.shift = Math.round(c - (BLK_W - 1) / 2);
  renderBlock();
}

function cinemasWithSessions() {
  return new Set((state.data?.cinemas || []).filter(c => c.sessions.length).map(c => c.cinemaId));
}

function renderCinemaList() {
  if (!cinemas || !$('wfCines')) return;
  const has = cinemasWithSessions();
  const q = wf.filter.trim().toLowerCase();
  const list = cinemas.filter(c => !q || c.name.toLowerCase().includes(q) || wf.selected.has(c.id));
  $('wfCines').innerHTML = list.map(c => `
    <label><input type="checkbox" value="${esc(c.id)}" ${wf.selected.has(c.id) ? 'checked' : ''} onchange="toggleCinema(this)">
      ${esc(c.name)} ${has.has(c.id) ? '<span class="has-fn">con funciones</span>' : ''}</label>`).join('') || '<div class="note" style="padding:8px 12px">Sin resultados</div>';
  $('wfCount').textContent = wf.selected.size ? `· ${wf.selected.size} elegido${wf.selected.size > 1 ? 's' : ''}` : '';
}

function toggleCinema(el) {
  el.checked ? wf.selected.add(el.value) : wf.selected.delete(el.value);
  $('wfCount').textContent = wf.selected.size ? `· ${wf.selected.size} elegido${wf.selected.size > 1 ? 's' : ''}` : '';
}

function markCinemasWithSessions() { renderCinemaList(); }

const sec = id => { const v = parseFloat($(id).value); return Number.isFinite(v) && v >= 0 ? Math.round(v * 1000) : null; };

async function createWatcher() {
  $('wfErr').textContent = '';
  if (!wf.selected.size) { $('wfErr').textContent = 'Elige al menos un cine'; return; }
  const w = wf.editing;
  const m = w ? { id: w.movieId, title: w.movieTitle, posterUrl: w.posterUrl } : movieInfo();
  const body = {
    movieId: m.id, movieTitle: m.title, posterUrl: m.posterUrl,
    cinemas: cinemas.filter(c => wf.selected.has(c.id)).map(c => ({ id: c.id, name: c.name })),
    pollMinMs: sec('wfMin') ?? 3000, pollMaxMs: sec('wfMax') ?? 5000, slowPollMs: sec('wfSlow') ?? 60000,
    blockCols: parseInt($('wfCols').value), blockRows: parseInt($('wfRows').value), blockDepth: blk.depth, blockShift: blk.shift,
    threads: parseInt($('wfThreads').value), maxPerOrder: parseInt($('wfPerOrder').value), ticketCode: $('wfTicket').value.trim(),
    profile: wf.profile || 'preventa',
    fireMode: $('wfFire').value, holdGuessMs: Math.round((parseFloat($('wfHoldGuess').value) || 0) * 60000),
    burst: $('wfBurst').checked, renew: $('wfRenew').checked,
    burstLeadMs: sec('wfBurstLead') ?? 8000, burstIntervalMs: sec('wfBurstEvery') ?? 1000, burstSpanMs: sec('wfBurstSpan') ?? 30000,
    renewLeadMs: sec('wfRenewLead') ?? 45000,
    intervalMs: sec('wfInterval') ?? 180000, baselineMs: sec('wfBaseline') ?? 10000,
    windowMinMs: sec('wfWinMin') ?? 5000, windowMaxMs: sec('wfWinMax') ?? 10000,
    retryMinMs: sec('wfRetryMin') ?? 3000, retryMaxMs: sec('wfRetryMax') ?? 5000,
    sessionsPerCinema: parseInt($('wfSessions').value), prefFrom: $('wfFrom').value, prefTo: $('wfTo').value,
  };
  try {
    if (w) {
      await post(`/bot/watchers/${w.id}`, { ...body, applyToJobs: $('wfApply').checked });
      $('wfSub').textContent = '✓ Cambios guardados';
      wf.editing = null;
    } else {
      await api('/bot/watchers', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      $('wfSub').textContent = '✓ Vigía iniciado';
    }
    wf.selected.clear(); renderCinemaList();
    loadWatchers();
    $('watchersCard').scrollIntoView({ behavior: 'smooth' });
  } catch (e) { $('wfErr').textContent = e.message; }
}

// ── Lista de vigías ───────────────────────────────────────────────────────────
const post = (path, body = {}) => api(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });

async function loadWatchers() {
  try {
    const [w, a] = await Promise.all([api('/bot/watchers'), api('/bot/alerts')]);
    profiles = w.profiles || profiles;
    renderWatchers(w.watchers || []);
    renderAlerts(a.alerts || []);
  } catch {}
}

function jobState(j) {
  if (!j) return '<span class="st st-stop">Job eliminado</span>';
  if (!j.running)   return '<span class="st st-stop">Detenido</span>';
  if (j.alert)      return '<span class="st st-alert">🔔 ¡Libres para ti!</span>';
  if (j.paused)     return '<span class="st st-pause">⏸ Pausado · avisa al liberarse</span>';
  if (j.mode === 'hold') return '<span class="st st-hold">Retenidos</span>';
  if (j.mode === 'retry') return '<span class="st st-try">Reintentando</span>';
  return `<span class="st st-run">${j.successes ? 'Reservando' : 'Intentando'}</span>`;
}

function renderWatchers(list) {
  wf.list = list;
  const running = list.filter(w => w.running).length;
  $('watchersSub').textContent = list.length ? `${list.length} vigía${list.length > 1 ? 's' : ''} · ${running} activo${running !== 1 ? 's' : ''}` : '';
  if (!list.length) {
    $('watchers').innerHTML = '<div class="watchers-empty">Aún no hay vigías. Elige una película abajo y los cines a vigilar.</div>';
    return;
  }
  $('watchers').innerHTML = '<div class="watchers">' + list.map(w => {
    const jobsOf = w.sessions.filter(x => x.job);
    const activeJobs = jobsOf.filter(x => x.job.running && !x.job.paused);
    const st = !w.running ? '<span class="st st-stop">Detenido</span>'
      : w.slowMode ? `<span class="st st-found">✓ Funciones reservadas · revisa cada ${(w.slowPollMs || 60000) / 1000} s</span>`
      : w.foundAt ? '<span class="st st-found">🎉 Funciones detectadas · faltan cines</span>'
      : '<span class="st st-run">Vigilando…</span>';
    const next = w.running && w.nextAt ? ` · próxima en ${Math.max(0, Math.round((w.nextAt - Date.now()) / 1000))} s` : '';
    const rows = w.sessions.map(x => `
      <tr>
        <td><b>${esc(x.cinemaName)}</b><br><span class="muted">${x.showtime ? esc(`${fmtDate(x.showtime.slice(0, 10))} ${fmtTime(x.showtime)}`) : esc(x.key)}${x.screenName ? ' · ' + esc(x.screenName) : ''}</span></td>
        <td>${x.status === 'job'
          ? `${jobState(x.job)} <span class="muted" title="${esc((x.seats || []).join(' '))}">${(x.seats || []).length > 8 ? `${x.seats.length} butacas` : esc((x.seats || []).join(' '))}</span>${x.job ? `<br><a href="/" class="muted">${esc(x.job.name)}</a>` : ''}`
          : `<span class="st st-err">Pendiente</span> <span class="muted">${esc(x.msg || '')}</span>`}</td>
      </tr>`).join('');
    return `
      <div class="wcard ${w.foundAt ? 'found' : ''}">
        <div class="whead">
          ${w.posterUrl ? `<img class="poster" src="${esc(w.posterUrl)}" alt="" onerror="this.style.visibility='hidden'">` : '<div class="poster"></div>'}
          <div class="wmain">
            <div class="wtitle">${esc(w.movieTitle)} ${profileBadge(w.profile || 'preventa', w.profileDiff || [])} ${st}</div>
            <div class="wline">Cines: <b>${w.cinemas.map(c => esc(c.name)).join(', ')}</b></div>
            <div class="wline">máx. ${w.sessionsPerCinema} funciones por cine (primera + ${esc(w.prefFrom)}–${esc(w.prefTo)}) · bloque ${w.blockCols || w.seatCount}×${w.blockRows || 1} · ${w.threads || 1} hilo${(w.threads || 1) > 1 ? 's' : ''} · entrada ${esc(w.ticketCode)}</div>
            ${w.retryMinMs ? `<div class="wline">Ritmo de los jobs: sin medición ${w.intervalMs / 1000} s · complementaria ${w.baselineMs ? w.baselineMs / 1000 + ' s' : 'no'} · ventana ${w.windowMinMs / 1000}–${w.windowMaxMs / 1000} s · reintento ${w.retryMinMs / 1000}–${w.retryMaxMs / 1000} s</div>` : ''}
            <div class="wline">Cada ${w.pollMinMs / 1000}–${w.pollMaxMs / 1000} s · ${w.checks} consultas${w.lastCheckAt ? ` · última ${fmtClock(w.lastCheckAt)}` : ''}${next}</div>
            ${w.lastError ? `<div class="wline" style="color:#c02c4b">⚠ ${esc(w.lastError)}</div>` : ''}
            ${w.running && !w.foundAt ? `<div class="wline">${!w.movieSeenAt
              ? 'La película aún no figura en el catálogo del cine.'
              : `<b>Aún sin funciones en los cines elegidos</b>${w.status?.others ? ` · sí tiene ${w.status.others} en otros cines` : ''}. En cuanto aparezcan, se reservan.`}</div>` : ''}
          </div>
          <div class="wactions">
            ${w.running
              ? `<button class="btn btn-pink btn-sm" onclick="watcherAction('${w.id}','stop')">⏹ Detener</button>`
              : `<button class="btn btn-green btn-sm" onclick="watcherAction('${w.id}','start')">▶ Iniciar</button>`}
            ${activeJobs.length ? `<button class="btn btn-pause btn-sm" title="Sus jobs dejan de reservar y solo avisan" onclick="pauseWatcherJobs('${w.id}', true)">⏸ Pausar ${activeJobs.length} job${activeJobs.length > 1 ? 's' : ''}</button>` : ''}
            ${jobsOf.some(x => x.job.running && x.job.paused) ? `<button class="btn btn-light btn-sm" onclick="pauseWatcherJobs('${w.id}', false)">▶ Quitar pausa</button>` : ''}
            <button class="btn btn-light btn-sm" onclick="editWatcher('${w.id}')">✏️ Editar</button>
            <button class="btn btn-light btn-sm" onclick="watcherAction('${w.id}','delete')">Eliminar</button>
          </div>
        </div>
        ${rows ? `<table class="wsess">${rows}</table>` : ''}
        ${w.events?.length ? `<div class="wevents">${w.events.slice(0, 12).map(e => `<div class="${esc(e.type)}">${fmtClock(e.time)} ${esc(e.msg)}</div>`).join('')}</div>` : ''}
      </div>`;
  }).join('') + '</div>';
  state.watchers = list;
}

async function watcherAction(id, action) {
  if (action === 'delete' && !confirm('¿Eliminar este vigía? Los jobs que ya creó siguen en el panel.')) return;
  try { await post(`/bot/watchers/${id}/${action}`); } catch (e) { alert(e.message); }
  loadWatchers();
}

async function pauseWatcherJobs(id, paused) {
  const w = (state.watchers || []).find(x => x.id === id);
  const ids = (w?.sessions || []).filter(x => x.job?.running && x.job.paused !== paused).map(x => x.job.id);
  if (paused && !confirm(`¿Pausar ${ids.length} jobs? Todas sus butacas quedan liberadas para ti: el bot deja de tomarlas y te avisa apenas se liberen.`)) return;
  await Promise.all(ids.map(j => post(`/bot/jobs/${j}/${paused ? 'pause' : 'resume'}`).catch(() => {})));
  loadWatchers();
}

// ── Aviso: butacas liberadas para ti que quedaron libres (o que se ocuparon) ───
const alertSeen = new Set();
let simAlert = null, lastAlerts = [];
function renderAlerts(alerts) {
  lastAlerts = alerts;
  alerts = simAlert ? [simAlert, ...alerts] : alerts;
  const where = a => `${esc(a.cinemaName)} · ${esc(a.movieTitle)}${a.showtime ? ` · ${esc(fmtDate(a.showtime.slice(0, 10)))} ${fmtTime(a.showtime)}` : ''}${a.screenName ? ` · ${esc(a.screenName)}` : ''}`;
  $('alerts').innerHTML = alerts.map(a => a.sim ? simAlertHtml(a) : `
    ${a.seats.length ? `<div class="alert-box">
      <div class="alert-ico">🔔</div>
      <div class="alert-main">
        <div class="alert-title">¡Tus butacas están libres! Cómpralas ya desde otro dispositivo</div>
        <div class="alert-sub">${where(a)} · libres desde las ${fmtClock(a.at)}</div>
        <div class="alert-seats">${a.seats.map(x => `<span>${esc(x)}</span>`).join('')}</div>
      </div>
      <div class="alert-actions">
        <button class="btn btn-sm solid" onclick="alertAction('${a.jobId}','bought')">✅ Ya las compré</button>
        <button class="btn btn-sm" onclick="alertAction('${a.jobId}','take')">🔒 Que el bot las tome</button>
        <button class="btn btn-sm" onclick="alertAction('${a.jobId}','ack')">🔕 Silenciar</button>
      </div>
    </div>` : ''}
    ${a.gone?.length ? `<div class="alert-box" style="background:linear-gradient(135deg,#7a5c00,#b07d00);animation:none">
      <div class="alert-ico" style="animation:none">ℹ️</div>
      <div class="alert-main">
        <div class="alert-title">Ya no están libres: ¿las compraste?</div>
        <div class="alert-sub">${where(a)}</div>
        <div class="alert-seats">${a.gone.map(x => `<span style="color:#7a5c00">${esc(x)}</span>`).join('')}</div>
      </div>
      <div class="alert-actions">
        <button class="btn btn-sm solid" style="color:#7a5c00" onclick="alertAction('${a.jobId}','bought','gone')">✅ Sí, compradas</button>
        <button class="btn btn-sm" onclick="alertAction('${a.jobId}','take','gone')">🔒 Que el bot las vuelva a buscar</button>
        <button class="btn btn-sm" onclick="alertAction('${a.jobId}','ack','gone')">🔕 Silenciar</button>
      </div>
    </div>` : ''}`).join('');
  const fresh = alerts.filter(a => (a.sim || a.seats.length) && !alertSeen.has(`${a.jobId}|${a.seats.join()}|${a.at}`));
  for (const a of fresh) { alertSeen.add(`${a.jobId}|${a.seats.join()}|${a.at}`); announce(`${a.cinemaName} · ${a.movieTitle}`, 0, `¡Libres para ti!: ${a.seats.join(', ')}`); }
}

// Simulador: el mismo aviso (banda, sonido y notificación) con datos de un job de un vigía, sin tocar el servidor
function simAlertHtml(a) {
  return `
    <div class="alert-box">
      <div class="alert-ico">🔔</div>
      <div class="alert-main">
        <div class="alert-title">¡Tus butacas están libres! Cómpralas ya desde otro dispositivo <span style="font-size:.7rem;background:rgba(0,0,0,.25);padding:2px 7px;border-radius:3px;vertical-align:middle">SIMULACIÓN</span></div>
        <div class="alert-sub">${esc(a.cinemaName)} · ${esc(a.movieTitle)}${a.showtime ? ` · ${esc(fmtDate(a.showtime.slice(0, 10)))} ${fmtTime(a.showtime)}` : ''}${a.screenName ? ` · ${esc(a.screenName)}` : ''} · libres desde las ${fmtClock(a.at)}</div>
        <div class="alert-seats">${a.seats.map(x => `<span>${esc(x)}</span>`).join('')}</div>
        <div class="alert-sub" style="margin-top:8px">Así aparecerá (aquí, en el panel y por Telegram) cuando se liberen butacas que liberaste para ti. Los botones reales serán “✅ Ya las compré”, “🔒 Que el bot las tome” y “🔕 Silenciar”.</div>
      </div>
      <div class="alert-actions">
        <button class="btn btn-sm solid" onclick="closeSimAlert()">✕ Cerrar simulación</button>
      </div>
    </div>`;
}

async function simulateAlert() {
  try { if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission().catch(() => {}); } catch {}
  const w = (state.watchers || []).find(x => x.sessions.some(s => s.status === 'job')) || (state.watchers || [])[0];
  const x = w?.sessions.find(s => s.status === 'job');
  simAlert = {
    sim: true, jobId: 'sim', at: Date.now(),
    cinemaName: x?.cinemaName || w?.cinemas[0]?.name || 'CP Ejemplo', movieTitle: w?.movieTitle || 'Película de ejemplo',
    showtime: x?.showtime || null, screenName: x?.screenName || 'Sala 1',
    seats: x?.seats?.length ? x.seats.slice(0, 3) : ['F8', 'F9', 'F10'], gone: [],
  };
  renderAlerts(lastAlerts);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function closeSimAlert() { simAlert = null; renderAlerts(lastAlerts); }

async function alertAction(id, action, which) {
  const a = lastAlerts.find(x => x.jobId === id);
  if (!a) return;
  const labels = which === 'gone' ? a.gone : a.seats;
  await post('/bot/seats', { cinemaId: a.cinemaId, sessionId: a.sessionId, labels, action }).catch(e => alert(e.message));
  loadWatchers();
}

// ── Inicio ────────────────────────────────────────────────────────────────────
loadWatchers();
setInterval(loadWatchers, 4000);
loadList();
const initial = new URLSearchParams(location.search).get('id');
if (initial) selectMovie(initial.toUpperCase());
</script>
