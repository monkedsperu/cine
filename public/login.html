<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cine Bot · Acceso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root { --side: #181824; --side-head: #3dd598; --purple: #8f5fe8; --purple-2: #7a48de; --pink: #fe5c7c; --border: #e6e9f0; --muted: #8d90a5; --text: #1f1f2e; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Roboto', -apple-system, 'Segoe UI', sans-serif; min-height: 100vh;
  display: flex; align-items: center; justify-content: center; padding: 16px;
  background: linear-gradient(135deg, var(--side) 0%, #26263a 100%); color: var(--text);
}
.box { width: 100%; max-width: 360px; background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,.35); }
.head { background: var(--side); color: #fff; padding: 22px 26px; display: flex; align-items: center; gap: 10px; font-size: 1.2rem; font-weight: 700; }
.mark { width: 12px; height: 26px; background: var(--side-head); border-radius: 2px; }
.head small { font-weight: 400; color: #8a8aa0; font-size: .8rem; }
form { padding: 26px; }
label { display: block; font-size: .75rem; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 6px; }
input {
  width: 100%; border: 1px solid var(--border); border-radius: 4px; padding: 10px 12px; font-size: .95rem; font-family: inherit;
}
input:focus { outline: none; border-color: var(--purple); }
button {
  width: 100%; margin-top: 16px; padding: 11px; border: none; border-radius: 4px; cursor: pointer;
  background: var(--purple); color: #fff; font-size: .9rem; font-weight: 500; font-family: inherit;
}
button:hover { background: var(--purple-2); }
button:disabled { opacity: .5; cursor: default; }
.err { color: var(--pink); font-size: .82rem; margin-top: 12px; min-height: 1em; }
</style>
</head>
<body>
<div class="box">
  <div class="head"><div class="mark"></div>Cine <small>bot</small></div>
  <form id="f">
    <label for="pw">Contraseña</label>
    <input type="password" id="pw" autocomplete="current-password" autofocus required>
    <button id="btn">Entrar</button>
    <div class="err" id="err"></div>
  </form>
</div>
<script>
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('btn'), err = document.getElementById('err');
  btn.disabled = true; err.textContent = '';
  try {
    const r = await fetch('/auth/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: document.getElementById('pw').value }),
    });
    const d = await r.json();
    if (r.ok) { location.href = '/'; return; }
    err.textContent = d.error || 'Error';
  } catch { err.textContent = 'No se pudo conectar con el servidor'; }
  btn.disabled = false;
});
</script>
</body>
</html>
