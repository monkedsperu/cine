# nginx con HTTPS: el panel deja de viajar en texto plano (contraseña y cookie de sesión).
# Requiere un dominio apuntando al servidor (p. ej. bot.midominio.com) y certbot:
#   sudo apt install -y certbot python3-certbot-nginx
#   sudo certbot certonly --nginx -d bot.midominio.com
# Luego copiar a /etc/nginx/sites-available/cine-bot (en lugar de nginx-cine-bot.conf), cambiar el dominio,
# y: sudo nginx -t && sudo systemctl reload nginx. En Lightsail abrir TCP 443 (y cerrar el 4100).
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bot.midominio.com;

    ssl_certificate     /etc/letsencrypt/live/bot.midominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bot.midominio.com/privkey.pem;

    # Opcional: solo tus IPs (descomentar y ajustar)
    # allow 203.0.113.10;
    # deny all;

    client_max_body_size 1m;

    location / {
        proxy_pass         http://127.0.0.1:5100;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name bot.midominio.com;
    return 301 https://$host$request_uri;
}
