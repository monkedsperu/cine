# nginx: expone el bot en el puerto 4100 y lo reenvía al 5100 local.
# Copiar a /etc/nginx/sites-available/cine-bot y enlazar en sites-enabled.
server {
    listen 4100;
    listen [::]:4100;
    server_name _;

    client_max_body_size 1m;

    location / {
        proxy_pass         http://127.0.0.1:5100;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # "Reservar ahora" puede tardar si el cine responde lento
    }
}
